services:
  - type: web
    name: bot-telegram
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
